  <rect class="paper" x="39" y="79" width="102" height="61" rx="4"/>
  <rect class="accent" x="159" y="49" width="102" height="61" rx="4"/>
  <rect class="paper" x="279" y="109" width="102" height="61" rx="4"/>
  <path class="route" d="M141 109h13m107-29h49v23m-13-11 13 11 10-11M89 140v16h184"/>
  <path class="line" d="M78 90h23v17H78zM201 59h18v17h-18zM312 129h35m-29 0 4-8h15l4 8"/>
  <text x="90" y="126">Заказчик</text>
  <text x="210" y="96">Крановщик</text>
  <text x="330" y="151">Стропальщик</text>
</svg>
