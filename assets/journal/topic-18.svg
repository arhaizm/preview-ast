<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <title>Роли заказчика, крановщика и стропальщика в согласовании подъёма</title>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#46493d" stroke-width=".55" opacity=".18"/>
    </pattern>
  </defs>
  <style>
    .paper{fill:#f5f4ec;stroke:#46493d;stroke-width:1.65}
    .wash{fill:#c6c3ae}
    .accent{fill:#e2b649;stroke:#46493d;stroke-width:1.4}
    .water{fill:#abbdc4;stroke:#46493d;stroke-width:1.2}
    .line{stroke:#46493d;stroke-width:1.65}
    .strong{stroke:#46493d;stroke-width:2.5}
    .route{stroke:#46493d;stroke-width:1.4;stroke-dasharray:4 3}
    .soft{stroke:#46493d;stroke-width:1.1;opacity:.62}
    .dot{fill:#46493d}
    text{fill:#46493d;font:600 11px sans-serif;text-anchor:middle}
  </style>
  <path fill="#e9e6db" d="M0 0h420v210H0z"/>
