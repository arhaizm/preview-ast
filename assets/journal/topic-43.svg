  <path class="route" d="M122 106h53v-27h70v27h51m-10-6 10 6-10 6"/>
  <circle class="dot" cx="175" cy="79" r="5"/>
  <circle class="dot" cx="245" cy="79" r="5"/>
  <text x="96" y="175">Загрузка</text>
  <text x="322" y="175">Приёмка</text>
</svg>
