<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <title>Маршрут поддонов от места загрузки до места приёмки</title>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#4a493c" stroke-width=".55" opacity=".18"/>
    </pattern>
  </defs>
  <style>
    .paper{fill:#f5f4ec;stroke:#4a493c;stroke-width:1.65}
    .wash{fill:#c8c5b3}
    .accent{fill:#e2b649;stroke:#4a493c;stroke-width:1.4}
    .water{fill:#abbdc4;stroke:#4a493c;stroke-width:1.2}
    .line{stroke:#4a493c;stroke-width:1.65}
    .strong{stroke:#4a493c;stroke-width:2.5}
    .route{stroke:#4a493c;stroke-width:1.4;stroke-dasharray:4 3}
    .soft{stroke:#4a493c;stroke-width:1.1;opacity:.62}
